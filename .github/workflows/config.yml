name: Build Plugin
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Download Paper API & Compile
        run: |
          mkdir -p out/me/server/tglink
          curl -sL "https://papermc.io" -o paper-api.jar
          javac -encoding UTF-8 -cp paper-api.jar -d out src/main/java/me/server/tglink/TgLinkPlugin.java
          cp src/main/resources/* out/
          jar cf TgLink.jar -C out .
      - uses: actions/upload-artifact@v4
        with:
          name: SortoLink-Plugin
          path: SortoLibk.jar
